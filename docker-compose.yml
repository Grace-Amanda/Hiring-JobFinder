version: '3.8'
services:

  # Container 1: Aplikasi PHP Laravel
  app:
    build: .
    container_name: hiring_app
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db        # Nama service db di bawah, BUKAN 127.0.0.1
      - DB_DATABASE=HIRING_JOBFINDER
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret

  # Container 2: Web Server Nginx
  webserver:
    image: nginx:alpine
    container_name: hiring_nginx
    ports:
      - "8000:80"        # Port 8000 di komputermu -> Port 80 di container
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Container 3: Database MySQL
  db:
    image: mysql:8.0
    container_name: hiring_db
    environment:
      MYSQL_DATABASE: HIRING_JOBFINDER
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql   # Data tersimpan permanen

volumes:
  db_data:
