services:

  # Container 1: Aplikasi PHP Laravel
  app:
    build: .
    container_name: hiring_app
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=HIRING_JOBFINDER
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    networks:
      - hiring_network

  # Container 2: Web Server Nginx
  webserver:
    image: nginx:alpine
    container_name: hiring_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hiring_network

  # Container 3: Database MySQL
  db:
    image: mysql:8.0
    container_name: hiring_db
    environment:
      MYSQL_DATABASE: HIRING_JOBFINDER
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hiring_network

networks:
  hiring_network:
    driver: bridge

volumes:
  db_data: